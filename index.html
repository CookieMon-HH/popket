<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d2e" />
    <title>Popket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="screen-wrap"><canvas id="screen"></canvas></div>
      <div id="rotate">화면을 가로로 돌리면 더 크게 볼 수 있어요</div>
      <div id="touch">
        <div id="stick-zone"></div>
        <div id="stick"><div id="knob"></div></div>
        <div class="ab">
          <button data-btn="b" class="b" aria-label="B 버튼">B</button>
          <button data-btn="a" class="a" aria-label="A 버튼">A</button>
        </div>
      </div>
      <div id="help">이동 방향키/WASD · 결정 Z/Space/Enter · 취소·메뉴 X/Esc</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
